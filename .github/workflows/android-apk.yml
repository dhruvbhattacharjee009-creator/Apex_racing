name: Build APEX RACING Android APK

on:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Export native Android APK
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --path . --export-debug "Android" build/APEX-Racing-debug.apk

      - name: Verify APK exists
        run: |
          test -s build/APEX-Racing-debug.apk
          file build/APEX-Racing-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-RACING-Android-APK
          path: build/APEX-Racing-debug.apk
          if-no-files-found: error
          retention-days: 14
