name: Build APEX RACING Android APK

on:
  push:
    branches: [main]
    paths:
      - "**.gd"
      - "**.tscn"
      - "**.tres"
      - "project.godot"
      - "export_presets.cfg"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

concurrency:
  group: apex-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-android:
    name: Export native Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Install build utilities and Java
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y curl unzip openjdk-17-jdk-headless

      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Godot 4.4 Android SDK requirements
        timeout-minutes: 20
        run: |
          set -eu
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/lib/android-sdk}}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null
          timeout 15m "$SDKMANAGER" --sdk_root="$SDK_ROOT" \
            "platform-tools" \
            "build-tools;34.0.0" \
            "platforms;android-34" \
            "cmake;3.10.2.4988404" \
            "ndk;23.2.8568313"
          test -s "$SDK_ROOT/platforms/android-34/android.jar"
          test -x "$SDK_ROOT/build-tools/34.0.0/aapt"
          test -x "$SDK_ROOT/platform-tools/adb"
          test -x "$SDK_ROOT/ndk/23.2.8568313/ndk-build"
          test -x "$SDK_ROOT/cmake/3.10.2.4988404/bin/cmake"
          echo "Verified Android SDK packages in $SDK_ROOT"

      - name: Install Godot Android export templates
        timeout-minutes: 10
        run: |
          set -eu
          VERSION="4.4.1"
          DEST="$HOME/.local/share/godot/export_templates/${VERSION}.stable"
          mkdir -p "$DEST" /tmp/godot-templates
          curl -fL "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_export_templates.tpz" -o /tmp/godot-templates.tpz
          unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
          cp /tmp/godot-templates/templates/* "$DEST/"
          test -s "$DEST/android_debug.apk"
          test -s "$DEST/android_release.apk"

      - name: Configure Java, Android SDK and debug signing
        run: |
          set -eu
          JAVAC="$(command -v javac)"
          JAVA_HOME_DIR="$(dirname "$(dirname "$(readlink -f "$JAVAC")")")"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          if [ -z "$SDK_ROOT" ]; then
            for candidate in /opt/android-sdk /opt/android-sdk-linux /usr/lib/android-sdk /usr/local/android-sdk /root/android-sdk; do
              if [ -d "$candidate/platform-tools" ]; then SDK_ROOT="$candidate"; break; fi
            done
          fi
          if [ -z "$SDK_ROOT" ]; then
            SDKMANAGER="$(find /opt /usr/lib /usr/local -type f -name sdkmanager 2>/dev/null | head -n 1 || true)"
            case "$SDKMANAGER" in
              */cmdline-tools/*) SDK_ROOT="${SDKMANAGER%%/cmdline-tools/*}" ;;
              */tools/*) SDK_ROOT="${SDKMANAGER%%/tools/*}" ;;
            esac
          fi
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT"
          mkdir -p "$HOME/.android" "$HOME/.config/godot"
          if [ ! -s "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME_DIR"
          export/android/debug_keystore = "$HOME/.android/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          echo "Java SDK: $JAVA_HOME_DIR"
          echo "Android SDK: $SDK_ROOT"

      - name: Import project resources
        run: godot --headless --editor --path . --quit

      - name: Export Android APK
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/APEX-Racing-debug.apk

      - name: Verify APK exists
        run: |
          test -s build/APEX-Racing-debug.apk
          unzip -t build/APEX-Racing-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: APEX-RACING-Android-APK
          path: build/APEX-Racing-debug.apk
          if-no-files-found: error
          retention-days: 14
